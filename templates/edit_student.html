<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:#050505;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;

            overflow-x:hidden;

            position:relative;
        }

        /* Animated Background */

        body::before{

            content:"";

            position:fixed;

            inset:0;

            background:
            linear-gradient(
                45deg,
                #071107,
                #000,
                #102010,
                #000
            );

            background-size:400% 400%;

            animation:bgMove 12s ease infinite;

            z-index:-2;
        }

        @keyframes bgMove{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        /* Glow */

        .glow{

            position:fixed;

            width:500px;
            height:500px;

            background:rgba(0,255,100,0.08);

            border-radius:50%;

            filter:blur(100px);

            top:-100px;
            right:-100px;

            z-index:-1;
        }

        /* Container */

        .container{

            width:100%;

            max-width:1200px;

            background:rgba(10,10,10,0.85);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:25px;

            padding:40px;

            backdrop-filter:blur(10px);

            box-shadow:
            0 0 30px rgba(0,255,100,0.12);
        }

        h1{

            text-align:center;

            color:#8cffc1;

            margin-bottom:35px;

            font-size:38px;

            font-weight:700;
        }

        form{

            display:grid;

            grid-template-columns:repeat(2,1fr);

            gap:25px;
        }

        .input-group{

            display:flex;

            flex-direction:column;
        }

        label{

            color:#8cffc1;

            margin-bottom:8px;

            font-size:14px;

            font-weight:500;
        }

        input,
        select{

            width:100%;

            padding:16px;

            border-radius:14px;

            border:1px solid rgba(255,255,255,0.08);

            background:#111;

            color:white;

            font-size:15px;

            outline:none;

            transition:0.3s;
        }

        input:focus,
        select:focus{

            border-color:#00ff88;

            box-shadow:
            0 0 15px rgba(0,255,120,0.25);
        }

        option{

            background:#111;

            color:white;
        }

        .full-width{

            grid-column:1 / -1;
        }

        button{

            width:100%;

            padding:18px;

            border:none;

            border-radius:14px;

            background:
            linear-gradient(
                90deg,
                #00c853,
                #64dd17
            );

            color:#000;

            font-size:18px;

            font-weight:700;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-3px);

            box-shadow:
            0 0 25px rgba(0,255,100,0.4);
        }

        /* Responsive */

        @media(max-width:768px){

            .container{

                padding:25px;
            }

            form{

                grid-template-columns:1fr;
            }

            h1{

                font-size:28px;
            }
        }

    </style>

</head>

<body>

    <div class="glow"></div>

    <div class="container">

        <h1>Edit Cadet Details</h1>

        <form action="/update/{{ student.id }}" method="POST">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="full_name"
                    value="{{ student.full_name }}"
                    required
                >

            </div>

            <div class="input-group">

                <label>Date of Birth</label>

                <input
                    type="date"
                    name="date_of_birth"
                    value="{{ student.date_of_birth }}"
                    required
                >

            </div>

            <div class="input-group">

                <label>NCC Year</label>

                <select name="ncc_year" required>

                    <option value="1" {% if student.ncc_year == '1' %}selected{% endif %}>1st Year</option>

                    <option value="2" {% if student.ncc_year == '2' %}selected{% endif %}>2nd Year</option>

                    <option value="3" {% if student.ncc_year == '3' %}selected{% endif %}>3rd Year</option>

                </select>

            </div>

            <div class="input-group">

                <label>Camp Name</label>

                <input
                    type="text"
                    name="camp_name"
                    value="{{ student.camp_name }}"
                    required
                >

            </div>

            <div class="input-group">

                <label>College Name</label>

                <input
                    type="text"
                    name="college_name"
                    value="{{ student.college_name }}"
                    required
                >

            </div>

            <div class="input-group">

                <label>Regiment Number</label>

                <input
                    type="text"
                    name="regiment_number"
                    value="{{ student.regiment_number }}"
                    required
                >

            </div>

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    value="{{ student.email }}"
                    required
                >

            </div>

            <div class="input-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ student.phone }}"
                    required
                >

            </div>

            <div class="full-width">

                <button type="submit">

                    Update Student

                </button>

            </div>

        </form>

    </div>

</body>

</html>
