<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ student[1] }}"
               required>

        <input type="text"
               name="department"
               value="{{ student[2] }}"
               required>

        <input type="text"
               name="year"
               value="{{ student[3] }}"
               required>

        <input type="text"
               name="phone"
               value="{{ student[4] }}"
               required>

        <button type="submit">
            Update Student
        </button>

    </form>

</div>

</body>
</html>
